        <!--vd xây dựng một ứng dụng khi di chuyển chuột thì sẽ xuất hiện một dãy số ngẫu nhiên, nếu người dùng click vào button Stop Random thì sẽ dừng random dãy số đó
        <div id="result"></div>
        <input type="button" value="Stop Random" id="stop_random" />
        <script language = "JavaScript">
            //B1: Lấy các đối tượng
            var result = document.getElementById("result");
            var button = document.getElementById("stop_random");
            var html = document.getElementsByTagName("html")[0];
            //B2: Định nghĩa hành động hiển thị dãy số random
            function do_random() {
                var randomString = Math.random();
                result.innerHTML = randomString;
            }
            //B3: Thêm hành động do_random cho sự kiện mousemove thẻ <html>,
            html.addEventListener("mousemove", do_random);
            //B4: Thêm sự kiện click cho button
            button.addEventListener("click", function(){
                //Xóa hành động do_random khỏi sự kiện mousemove
                html.removeEventListener("mousemove", do_random);
            });        
            </script>
