  <!-- jquery -->
  <script>
    $(document).ready(function () {
      // Xử lý sự kiện submit form
      $('form').on('submit', function (event) {
        event.preventDefault(); // Ngăn chặn form submit mặc định

        // Lấy giá trị từ input
        var username = $('#exampleInputEmail1').val();
        var password = $('#exampleInputPassword1').val();

        // Kiểm tra thông tin đăng nhập
        if (username === 'abc' && password === 'xyz') {
          // Ẩn modal
          $('#exampleModal').modal('hide');

          // Thay thế phần tử chứa nút "Đăng nhập" và "Đăng ký" bằng thông báo
          $('.ms-lg-1.ms-0.mt-lg-0.mt-3').replaceWith(`
                          <div class="ms-lg-1 ms-0 mt-lg-0 mt-3">
                              <span>Chào bạn abc</span>
                          </div>
                      `);
        } else {
          // Hiển thị thông báo lỗi nếu cần
          alert('Tên người dùng hoặc mật khẩu không đúng!');
        }
      });
    });
  </script>

  <!-- JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Lấy form element
      const form = document.querySelector('form');

      // Xử lý sự kiện submit form
      form.addEventListener('submit', function (event) {
        event.preventDefault(); // Ngăn chặn form submit mặc định

        // Lấy giá trị từ input
        const username = document.getElementById('exampleInputEmail1').value;
        const password = document.getElementById('exampleInputPassword1').value;

        // Kiểm tra thông tin đăng nhập
        if (username === 'abc' && password === 'xyz') {
          // Ẩn modal
          const modal = document.getElementById('exampleModal');
          const bootstrapModal = bootstrap.Modal.getInstance(modal);
          bootstrapModal.hide();

          // Thay thế phần tử chứa nút "Đăng nhập" và "Đăng ký" bằng thông báo
          const buttonContainer = document.querySelector('.ms-lg-1.ms-0.mt-lg-0.mt-3');
          buttonContainer.outerHTML = `
                <div class="ms-lg-1 ms-0 mt-lg-0 mt-3">
                    <span>Chào bạn abc</span>
                </div>
            `;
        } else {
          // Hiển thị thông báo lỗi
          alert('Tên người dùng hoặc mật khẩu không đúng!');
        }
      });
    });
  </script>
